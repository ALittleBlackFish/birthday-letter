<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开场动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #video-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        #video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="intro-video" src="assets/video/dance.mp4" preload="auto" playsinline disablePictureInPicture></video>
    </div>
    <script>
        var video = document.getElementById('intro-video');
        var audio = document.getElementById('dance');

        // 尝试自动播放视频（带声音）
        video.play().then(function () {
            // 视频自动播放成功，接着播放音频
            audio.play().catch(function () {});
        }).catch(function () {
            // 如果被阻止，点击任意处开始播放
            document.addEventListener('click', function playOnce() {
                video.play().catch(function () {});
                audio.play().catch(function () {});
                document.removeEventListener('click', playOnce);
            });
        });

        // 视频结束后自动跳转到 letter.html
        video.addEventListener('ended', function () {
            window.location.href = 'letter.html';
        });
    </script>
</body>
</html>
