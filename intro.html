<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开场动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #gif-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        #gif-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <div id="gif-container">
        <img id="intro-gif" src="assets/video/dance.gif" alt="开场动画">
    </div>
    <audio id="dance" src="assets/music/dance.mp3" preload="auto"></audio>

    <script>
        var audio = document.getElementById('dance');
        var gifContainer = document.getElementById('gif-container');

        // 尝试自动播放音频
        audio.play().catch(function () {
            // 如果自动播放被阻止，点击任意处播放
            document.addEventListener('click', function playOnce() {
                audio.play().catch(function () {});
                document.removeEventListener('click', playOnce);
            });
        });

        // 14.46秒后跳转到 letter.html
        setTimeout(function () {
            window.location.href = 'letter.html';
        }, 14460);
    </script>
</body>
</html>
